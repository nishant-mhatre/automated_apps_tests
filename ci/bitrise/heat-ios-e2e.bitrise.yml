# Bitrise workflow: build Heat (dev) for the iOS Simulator and run the Maestro E2E flows
# from this repo using the official "Maestro Test" step.
#
# How to add it (Bitrise -> Heat iOS app -> Workflows -> "bitrise.yml" tab, or recreate the
# same steps in the Workflow Editor):
#   1. Create `Dfanx_Heat_E2E_iOS` based on `Dfanx_Heat_dev`, and keep its steps from the
#      top down to and including "Plist upgrade | Fastlane config".
#   2. Delete the rest: "Remove all the simulator frameworks", "Strip XCFramework Size",
#      "Strip Pod Framework", "Signin frameworks", Xcode Archive, App Store upload. They
#      remove simulator slices, so a Simulator build can't run.
#   3. Add the steps below after "Plist upgrade | Fastlane config".
#   4. Keep the same Stack (Xcode version) as Dfanx_Heat_dev.
#
# Requirements in the app repo: WayfindingView.swift guards `import HeatWayfinding` /
# `import UnityFramework` with `#if canImport(...)`. Both frameworks are device-only, so the
# build step removes them from the project on the CI machine (never committed).
#
# Simulator iOS version: the app excludes arm64 for the simulator (EXCLUDED_ARCHS), so it's
# x86_64-only and runs through Rosetta. iOS 26+ simulators can't run x86_64-only apps, so the
# destination must use an iOS 18.x (or older) runtime installed on the stack.
#
# Results: "Test Reports" tab (each flow with its steps, screenshots and logs) and a zip of
# the Maestro output in Artifacts.

workflows:
  Dfanx_Heat_E2E_iOS:
    summary: Build Heat dev for the iOS Simulator and run Maestro E2E flows
    steps:
    # ---------------------------------------------------------------------------
    # >>> Setup steps from Dfanx_Heat_dev go here (down to "Plist upgrade | Fastlane config")
    # ---------------------------------------------------------------------------

    # Boots in the background while the app builds.
    - xcode-start-simulator@0:
        inputs:
        - destination: "$E2E_SIM_DESTINATION"

    - script@1:
        title: Clone E2E tests repo
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail
            rm -rf "$E2E_TESTS_DIR"
            git clone --depth 1 --branch "$E2E_TESTS_REF" "$E2E_TESTS_REPO" "$E2E_TESTS_DIR"
            git -C "$E2E_TESTS_DIR" log -1 --oneline

    # Plain `xcodebuild build` (not the "Xcode Build for Simulator" step: its archive-based
    # .app is killed at launch with "Code Signature Invalid"). Exports $BITRISE_APP_DIR_PATH.
    - script@1:
        title: Build Heat for iOS Simulator
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail
            "$E2E_TESTS_DIR/ci/ios/build_for_simulator.sh" \
              Heat2.0/MiamiHeat.xcworkspace MiamiHeat \
              --configuration Debug \
              --remove-framework HeatWayfinding.xcframework \
              --remove-framework UnityFramework.framework

    # First launch of a new x86_64 build is slow under Rosetta; launch it once before testing.
    - script@1:
        title: Warm up app on simulator
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail
            "$E2E_TESTS_DIR/ci/ios/warmup_app.sh" "$BITRISE_APP_DIR_PATH" 60

    - maestro-test@1:
        inputs:
        - flow_path: "$E2E_TESTS_DIR/heat"
        - app_path: "$BITRISE_APP_DIR_PATH"
        - test_name: Heat iOS E2E
        # The flows read their app id from ${APP_ID}.
        - additional_args: "-e APP_ID=$E2E_APP_ID"
        # Offline flows need the network turned off by hand on iOS.
        - exclude_tags: offline
        - include_tags: "$E2E_INCLUDE_TAGS"
        # Retry a failed flow once; if it passes the second time it's reported as flaky.
        - num_flaky_test_attempts: "1"
        - maestro_version: 2.12.1

    - deploy-to-bitrise-io@2:
        is_always_run: true

    # Optional: post the result to the team channel (same webhook as Dfanx_Heat_dev).
    # - slack@4:
    #     is_always_run: true
    #     inputs:
    #     - webhook_url: "$RAWENG_SLACK_WEBHOOK"
    #     - channel: d-heat
    #     - text: "Heat iOS E2E passed: ${BITRISE_BUILD_URL}"
    #     - text_on_error: "Heat iOS E2E FAILED: ${BITRISE_BUILD_URL}"

    envs:
    - E2E_TESTS_REPO: https://github.com/nishant-mhatre/automated_apps_tests.git
    - E2E_TESTS_REF: main
    - E2E_TESTS_DIR: $BITRISE_SOURCE_DIR/../automated_apps_tests
    - E2E_APP_ID: com.xcosoftware.miamiheat.dev
    # Must be an iOS 18.x (or older) runtime installed on the stack - see note above.
    - E2E_SIM_DESTINATION: platform=iOS Simulator,name=iPhone 16 Pro,OS=18.6
    # Empty = all flows; e.g. "smoke" to run only smoke-tagged flows.
    - E2E_INCLUDE_TAGS: ""
